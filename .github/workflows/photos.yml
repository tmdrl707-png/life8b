name: 사진 미리 받기
on:
  push:
    paths: ['ph/list.json', '.github/workflows/photos.yml', 'ph/fetch.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 ph/fetch.py
      - run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add ph
          git commit -m "사진 미리 받기 결과" || echo "변경 없음"
          git push
